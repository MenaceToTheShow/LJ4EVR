name: CI

# Design 9.3. Every job runs on GitHub-hosted runners (ME-159). The Linux jobs run
# in the CI container and only for push/tag events (the if: lines); the fork
# control is the approval setting (docs/ci.md rule 2, ME-149). Windows and macOS
# build for every event. determinism compares the three frame dumps byte for byte.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The container image is repeated per job because `container:` cannot read `env`.
# Pinned by digest (docs/ci.md): tag bc2fbf8 of docker.yml (lj4evr-build), debian:trixie, root.

jobs:
  generate-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menacetotheshow/lj4evr-build@sha256:731edd121abb7ce99293e7884a431dd30ea4813116d9e7ddf33ec6b064c91722
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Layering and conventions
        run: python3 -I tools/test_layering.py --src src --cc gcc
      - name: Generated files are current
        # every --check tool exists since W2; a missing one fails the step (W4 WIZARD_STYLES-14)
        run: |
          for t in qxf2c fontpack artpack gen_vectors exe_profiles_check; do
            echo "== $t"; python3 -I "tools/$t.py" --check || exit 1
          done

  linux-gcc-asan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      replay_sha: ${{ steps.replay.outputs.sha }}
    container:
      image: ghcr.io/menacetotheshow/lj4evr-build@sha256:731edd121abb7ce99293e7884a431dd30ea4813116d9e7ddf33ec6b064c91722
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ci-linux-asan
      - run: cmake --build --preset ci-linux-asan
      - run: ctest --preset ci-linux-asan
      - id: replay   # ME-78: every replay scenario's frames (ctest replay_dump), compared in determinism by sha
        run: echo "sha=$(sha256sum build-linux-asan/replay-frames.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: build-linux-asan/lj4evr_tests dump-frames frames-linux.bin
      - uses: actions/upload-artifact@v4
        with:
          name: frames-linux
          path: frames-linux.bin
          if-no-files-found: error

  linux-clang:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menacetotheshow/lj4evr-build@sha256:731edd121abb7ce99293e7884a431dd30ea4813116d9e7ddf33ec6b064c91722
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ci-linux-clang
      - run: cmake --build --preset ci-linux-clang
      - run: ctest --preset ci-linux-clang
      - name: Fuzz the .GS2 / .Udf readers and the five W5 parsers, 60 s each (LORD_C-17, W5-X-HOSTILE; docs/ci.md)
        run: |
          # ponytail: the image has clang 19 without compiler-rt; installed per run until docker.yml bakes it in
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libclang-rt-19-dev > /dev/null
          cmake -S . -B build-fuzz -G Ninja -DLJ_SDL=OFF -DLJ_FUZZ=ON -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined"
          cmake --build build-fuzz --target fuzz_gs2 fuzz_udf
          # ME-140: a UBSan report is fatal here through UBSAN_OPTIONS, not -fno-sanitize-recover=all: that flag in
          # CMAKE_C_FLAGS dropped fuzz_gs2 INITED coverage from 680 to 126 (measured A/B, fix pass A r1)
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          build-fuzz/fuzz_gs2 -max_total_time=60 -max_len=20851
          mkdir -p udf-corpus && cp build-linux-clang/lj_w3_synthetic.Udf udf-corpus/   # ME-114: an lj_udf_export seed (test_uiscript_w3)
          build-fuzz/fuzz_udf udf-corpus -max_total_time=60 -max_len=32768
          # W5-X-HOSTILE: the five W5 parsers, 60 s each (target:max_len)
          cmake --build build-fuzz --target fuzz_sacn_rx fuzz_vtr fuzz_artnet fuzz_remote fuzz_ljb fuzz_ljb_index
          # ME-186: each starts from its CTest row's proven seed (lj4evr_tests <row> --seed <dir>), not a 1-byte corpus
          for f in fuzz_sacn_rx:1024 fuzz_artnet:1024 fuzz_remote:4096 fuzz_vtr:16384 fuzz_ljb:65536; do
            t=${f%%:*}
            build-linux-clang/lj4evr_tests $t --seed corp-$t
            build-fuzz/$t corp-$t -max_total_time=60 -max_len=${f##*:}
          done
          # W5 LORD_C-7: fuzz_ljb's second mode mutates the inflated index (stored raw in its seed) and deflates it again
          build-linux-clang/lj4evr_tests fuzz_ljb --seed-index corp-fuzz_ljb_index
          build-fuzz/fuzz_ljb_index corp-fuzz_ljb_index -max_total_time=60 -max_len=65536

  windows-msvc:
    runs-on: windows-latest
    outputs:
      replay_sha: ${{ steps.replay.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: SDL3 commit from CMakeLists.txt
        id: sdl
        run: echo "tag=$(grep -oE 'GIT_TAG +\S+' CMakeLists.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: sdl-cache
        with:
          path: ${{ runner.temp }}/sdl3-src
          key: sdl3-src-${{ steps.sdl.outputs.tag }}
      - if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: git init -q "$RUNNER_TEMP/sdl3-src" && git -C "$RUNNER_TEMP/sdl3-src" fetch -q --depth 1 https://github.com/libsdl-org/SDL.git "${{ steps.sdl.outputs.tag }}" && git -C "$RUNNER_TEMP/sdl3-src" checkout -q FETCH_HEAD
      - name: NSIS
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Build, test, selftest, frames, CRT check, Debug build + ctest + selftest, installer (Ninja + cl; vcvars64 from the newest VS on the image)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset release-win -DFETCHCONTENT_SOURCE_DIR_SDL3="%RUNNER_TEMP%\sdl3-src" || exit /b 1
          cmake --build --preset release-win || exit /b 1
          ctest --preset release-win || exit /b 1
          build-release-win\lj4evr.exe --selftest || exit /b 1
          build-release-win\lj4evr_tests.exe dump-frames frames-windows.bin || exit /b 1
          rem ME-42: static CRT, the installed exe must not need the VC++ redistributable
          dumpbin /dependents build-release-win\lj4evr.exe || exit /b 1
          dumpbin /dependents build-release-win\lj4evr.exe | findstr /i "vcruntime api-ms-win-crt" && exit /b 1
          rem ME-38: the asserts (ME-16 binding check) only run without NDEBUG; Debug app + selftest, rc 0, no unbound handler
          cmake --preset debug-win -DFETCHCONTENT_SOURCE_DIR_SDL3="%RUNNER_TEMP%\sdl3-src" || exit /b 1
          cmake --build --preset debug-win || exit /b 1
          rem ME-70: the Debug tree under ctest too (/RTC1 fills, the ME-16 asserts); no other job runs a Debug MSVC ctest
          ctest --preset debug-win || exit /b 1
          build-debug-win\lj4evr.exe --selftest > selftest-debug.txt 2>&1 || (type selftest-debug.txt & exit /b 1)
          type selftest-debug.txt
          findstr /c:"no binding for handler" selftest-debug.txt && exit /b 1
          findstr /c:"unknown event" selftest-debug.txt && exit /b 1
          cd build-release-win && cpack -G NSIS || exit /b 1
      - name: MSVC AddressSanitizer, LJ_SDL=OFF, Debug ctest (W5 LORD_C-12 = W4 LORD_C-3; it caught LORD_C-1 where gcc did not)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-asan-win -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Debug -DLJ_SDL=OFF -DLJ_SANITIZE=address || exit /b 1
          cmake --build build-asan-win || exit /b 1
          ctest --test-dir build-asan-win --output-on-failure || exit /b 1
      - name: Standard-user install (ME-157, ME-45; a fresh local account outside Administrators, on this throwaway runner)
        shell: pwsh
        run: |
          $setup = Get-ChildItem build-release-win/LJ4EVR-*-win64-setup.exe | Select-Object -First 1
          pwsh -NoProfile -File tools/standard_user_install.ps1 -Installer $setup.FullName -Version (Get-Content VERSION -Raw).Trim()
      - id: replay   # ME-78
        run: echo "sha=$(sha256sum build-release-win/replay-frames.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-windows
          path: frames-windows.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: build-release-win/LJ4EVR-*-win64-setup.exe
          if-no-files-found: error

  macos-clang:
    runs-on: macos-14
    outputs:
      replay_sha: ${{ steps.replay.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: SDL3 commit from CMakeLists.txt
        id: sdl
        run: echo "tag=$(grep -oE 'GIT_TAG +\S+' CMakeLists.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: sdl-cache
        with:
          path: ${{ runner.temp }}/sdl3-src
          key: sdl3-src-${{ steps.sdl.outputs.tag }}
      - if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: git init -q "$RUNNER_TEMP/sdl3-src" && git -C "$RUNNER_TEMP/sdl3-src" fetch -q --depth 1 https://github.com/libsdl-org/SDL.git "${{ steps.sdl.outputs.tag }}" && git -C "$RUNNER_TEMP/sdl3-src" checkout -q FETCH_HEAD
      - run: cmake --preset release-mac -DFETCHCONTENT_SOURCE_DIR_SDL3="$RUNNER_TEMP/sdl3-src"
      - run: cmake --build --preset release-mac
      - run: ctest --preset release-mac
      - id: replay   # ME-78
        run: echo "sha=$(shasum -a 256 build-release-mac/replay-frames.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: build-release-mac/lj4evr.app/Contents/MacOS/lj4evr --selftest
      - run: build-release-mac/lj4evr_tests dump-frames frames-macos.bin
      - run: cd build-release-mac && cpack -G DragNDrop
      - uses: actions/upload-artifact@v4
        with:
          name: frames-macos
          path: frames-macos.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: build-release-mac/LJ4EVR-*-macos.dmg
          if-no-files-found: error

  determinism:
    if: github.event_name != 'pull_request'
    needs: [linux-gcc-asan, windows-msvc, macos-clang]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/menacetotheshow/lj4evr-build@sha256:731edd121abb7ce99293e7884a431dd30ea4813116d9e7ddf33ec6b064c91722
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
      - name: Three OSes, one byte stream
        run: |
          ls -l frames-*.bin
          cmp frames-linux.bin frames-windows.bin
          cmp frames-linux.bin frames-macos.bin
          sha256sum frames-*.bin
      - name: Three OSes, one replay-frames.bin (ME-78, every replay scenario)
        env:
          L: ${{ needs.linux-gcc-asan.outputs.replay_sha }}
          W: ${{ needs.windows-msvc.outputs.replay_sha }}
          M: ${{ needs.macos-clang.outputs.replay_sha }}
        run: |
          echo "replay-frames.bin linux   $L"
          echo "replay-frames.bin windows $W"
          echo "replay-frames.bin macos   $M"
          test -n "$L" && test "$L" = "$W" && test "$L" = "$M"
