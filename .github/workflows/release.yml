name: Release

# Design 9.5, the Anubis build-apps pattern: on a v* tag, both installers build on
# GitHub-hosted runners and one final job attaches them to a single GitHub Release,
# so the build jobs never race to create it. Everything here is hosted: nothing in
# this workflow touches atlas-ci2.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal v$(cat VERSION)
        id: v
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v (VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: SDL3 tag from CMakeLists.txt
        id: sdl
        run: echo "tag=$(grep -oE 'GIT_TAG +\S+' CMakeLists.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: sdl-cache
        with:
          path: ${{ runner.temp }}/sdl3-src
          key: sdl3-src-${{ steps.sdl.outputs.tag }}
      - if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.sdl.outputs.tag }}" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3-src"
      - name: NSIS
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Build, test, installer (Ninja + cl; vcvars64 from the newest VS on the image)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset release-win -DFETCHCONTENT_SOURCE_DIR_SDL3="%RUNNER_TEMP%\sdl3-src" || exit /b 1
          cmake --build --preset release-win || exit /b 1
          ctest --preset release-win || exit /b 1
          cd build-release-win && cpack -G NSIS || exit /b 1
      - run: test -f "build-release-win/LJ4EVR-${{ needs.check.outputs.version }}-win64-setup.exe"
      - name: No VC runtime dependency (ME-19, static CRT)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin /dependents build-release-win\lj4evr.exe
          dumpbin /dependents build-release-win\lj4evr.exe | findstr /i "vcruntime msvcp ucrtbase" && exit /b 1
          exit /b 0
      - name: Installer content (ME-36, W4-HELP) - silent per-user install, then the notices and topics are checked
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lj4evr-inst"
          $p = Start-Process -Wait -PassThru "build-release-win/LJ4EVR-${{ needs.check.outputs.version }}-win64-setup.exe" -ArgumentList "/S", "/D=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Get-ChildItem -Recurse $dir | Select-Object -ExpandProperty FullName
          python -I tools/help_check.py --install-tree $dir
          if ($LASTEXITCODE -ne 0) { throw "install tree check failed" }
      - name: VERSIONINFO resource on the installer (ME-45)
        shell: pwsh
        run: |
          $exe = Get-Item "build-release-win/LJ4EVR-${{ needs.check.outputs.version }}-win64-setup.exe"
          $vi = $exe.VersionInfo
          "ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion)"
          if ($vi.ProductVersion -ne "${{ needs.check.outputs.version }}") { throw "ProductVersion '$($vi.ProductVersion)' != VERSION" }
          if ($vi.ProductName -ne "LJ4EVR") { throw "ProductName '$($vi.ProductName)' != LJ4EVR" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: build-release-win/LJ4EVR-*-win64-setup.exe
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: SDL3 tag from CMakeLists.txt
        id: sdl
        run: echo "tag=$(grep -oE 'GIT_TAG +\S+' CMakeLists.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: sdl-cache
        with:
          path: ${{ runner.temp }}/sdl3-src
          key: sdl3-src-${{ steps.sdl.outputs.tag }}
      - if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.sdl.outputs.tag }}" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3-src"
      - run: cmake --preset release-mac -DFETCHCONTENT_SOURCE_DIR_SDL3="$RUNNER_TEMP/sdl3-src"
      - run: cmake --build --preset release-mac
      - run: ctest --preset release-mac
      - name: Strip, ad-hoc sign, verify
        # CPACK_STRIP_FILES would re-strip the installed copy and break the signature,
        # so strip here and tell cpack not to.
        run: |
          strip -x build-release-mac/lj4evr.app/Contents/MacOS/lj4evr
          codesign --force --deep -s - build-release-mac/lj4evr.app
          codesign --verify --deep --strict --verbose=2 build-release-mac/lj4evr.app
      - name: Bundle facts (W4-MAC) - universal, ad-hoc signed, version = VERSION, notices inside
        run: |
          app=build-release-mac/lj4evr.app
          lipo -info $app/Contents/MacOS/lj4evr
          archs=$(lipo -archs $app/Contents/MacOS/lj4evr)
          case " $archs " in *" arm64 "*) ;; *) echo "no arm64: $archs"; exit 1;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "no x86_64: $archs"; exit 1;; esac
          codesign -dv $app 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || { echo "not ad-hoc signed"; exit 1; }
          plutil -p $app/Contents/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw $app/Contents/Info.plist)" = "${{ needs.check.outputs.version }}"
          test "$(plutil -extract LSMinimumSystemVersion raw $app/Contents/Info.plist)" = "12.0"
          test -f $app/Contents/Resources/lj4evr.icns
          otool -l $app/Contents/MacOS/lj4evr | grep -A4 LC_BUILD_VERSION | grep minos
      - run: cd build-release-mac && cpack -G DragNDrop -D CPACK_STRIP_FILES=OFF
      - run: test -f "build-release-mac/LJ4EVR-${{ needs.check.outputs.version }}-macos.dmg"
      - name: .dmg content (W4-MAC, ME-36) - LJ4EVR.app, the Applications link, notices and topics in the bundle
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "build-release-mac/LJ4EVR-${{ needs.check.outputs.version }}-macos.dmg"
          ls -la "$mnt"
          test -L "$mnt/Applications"
          python3 -I tools/help_check.py --install-tree "$mnt"
          codesign --verify --deep --strict "$mnt/LJ4EVR.app"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: build-release-mac/LJ4EVR-*-macos.dmg
          if-no-files-found: error

  release:
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS and notes
        run: |
          cd dist
          ls -l
          sha256sum LJ4EVR-*.exe LJ4EVR-*.dmg > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          LJ4EVR $VERSION. Unsigned installers, built by GitHub-hosted runners; sums in \`SHA256SUMS\`.

          - **Windows:** \`LJ4EVR-$VERSION-win64-setup.exe\`, per-user install (no admin), uninstaller in Settings > Apps. SmartScreen will warn on an unsigned installer: *More info > Run anyway*.
          - **macOS 12+ (Intel + Apple Silicon):** \`LJ4EVR-$VERSION-macos.dmg\`, ad-hoc signed only. Drag LJ4EVR.app onto Applications. First launch: right-click LJ4EVR.app > **Open**, or clear the quarantine flag in Terminal: \`xattr -d com.apple.quarantine /Applications/LJ4EVR.app\`.

          Third-party licences: \`THIRD_PARTY_NOTICES.txt\` beside lj4evr.exe and in LJ4EVR.app/Contents/Resources. LightJockey is a trademark of Martin Professional; LJ4EVR is not affiliated with or endorsed by Martin Professional or HARMAN.

          **Not in this version** (planned for W5; their menu items, cue-list commands and toolbar buttons are present, greyed, with the hint "Not available in LJ4EVR"): the Audio Analyzer and audio trig, DMX-in over sACN input and the \`.vtr\` tables, the RS-232/TCP remote protocol, External Application string output, the \`.LJB\` importer, the LJ MediaPlayer, and Art-Net.

          Mac acceptance (ME-21): Joey runs the .dmg on his Mac and screenshots the Sequence window and one menu.
          EOF
      - name: Create GitHub Release
        run: |
          pre=""; case "$VERSION" in 0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "LJ4EVR $VERSION" \
            --notes-file notes.md $pre dist/LJ4EVR-*.exe dist/LJ4EVR-*.dmg dist/SHA256SUMS
