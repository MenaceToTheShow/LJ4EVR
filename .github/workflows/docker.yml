name: Docker image

# Builds docker/Dockerfile on a GitHub-hosted runner and pushes it to GHCR as
# ghcr.io/menacetotheshow/lj4evr-build:<short-sha> and :latest. ci.yml pins it by
# digest (docs/ci.md). Never runs on pull_request: push-to-main and manual runs only.

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/menacetotheshow/lj4evr-build

jobs:
  build-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: docker build --pull -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" docker
      - name: Smoke test
        run: docker run --rm "$IMAGE:latest" sh -c 'id -u && cmake --version && ninja --version && gcc --version && clang --version && python3 --version'
      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${GITHUB_SHA::7}"   # server-side retag: :latest is exactly the sha tag
      - name: Report digest (copy this into ci.yml to pin)
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::7}" --format '{{.Manifest.Digest}}')
          echo "$IMAGE@$digest"
          echo "Pushed \`$IMAGE:${GITHUB_SHA::7}\` (= \`:latest\`); pin ci.yml to \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
